{% extends "base.html" %}
{% block title %}Register — Mean Green Thumb{% endblock %}

{% block content %}
  <div class="card">
    <h1>Create an Account</h1>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="zip_code">Zip code</label>
      <input type="text" id="zip_code" name="zip_code" maxlength="5" required>

      <label for="notifications_enabled">
        <input type="checkbox" id="notifications_enabled" name="notifications_enabled" value="1">
        Email me freeze and frost alerts for my zip code
      </label>

      <button type="submit">Submit</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">Already have an account? Log in</a></p>
  </div>
{% endblock %}
